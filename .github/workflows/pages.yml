name: Publish Algo King
on:
  push:
    branches: [main]
  schedule:
    - cron: '20 14 * * 1-6'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync published exchange reports
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python3 -m pip install openpyxl
          python3 historical.py
          python3 sync_caps.py
          python3 sync_contracts.py
          python3 option_window.py
          python3 historical_minutes.py
          python3 monthly_research.py
          git add dist/market/*.json dist/market/option-window.json.gz
          if ! git diff --cached --quiet; then
            git -c user.name="Market Sync" -c user.email="market-sync@users.noreply.github.com" commit -m "Refresh broker instrument directory"
            git push
          fi
      - run: node private-site/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: published
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
