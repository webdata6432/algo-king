name: Recover missing NSE stock sessions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/archive-gap-repair.yml', 'repair_archive.py', 'supabase/functions/exchange-daily/**']
  schedule:
    - cron: '35 10 * * *'
    - cron: '15 15 * * *'
permissions:
  contents: read
  id-token: write
concurrency: exchange-archive-repair
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: python repair_archive.py
